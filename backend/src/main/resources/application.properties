spring.application.name=Expo

spring.config.import=optional:classpath:application-local.properties

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/Expo_db
spring.datasource.username=root
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Enable SQL logging
spring.jpa.show-sql=true
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update

# Error Handling Configuration
spring.web.error.include-message=always
spring.web.error.include-stacktrace=always

server.port=8080
spring.thymeleaf.cache=false

# AI (Gemini)
# put your key in application-local.properties (ai.api.key=...)
# or set the environment variable GEMINI_API_KEY
ai.api.key=${GEMINI_API_KEY:}
ai.api.url=https://generativelanguage.googleapis.com/v1beta/models
ai.model=gemini-3.5-flash-lite
ai.fallback.model=gemini-flash-lite-latest
ai.embedding.model=gemini-embedding-001

# UltraMsg WhatsApp Integration
ultramsg.instance-id=${ULTRAMSG_INSTANCE_ID:}
ultramsg.token=${ULTRAMSG_TOKEN:}
